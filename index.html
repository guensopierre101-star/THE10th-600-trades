<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>600 Trades Journal</title>
<style>
:root{--bg:#0a0305;--card:#150709;--card2:#1c0a0d;--bd:#4a1319;--tx:#f4eaea;--mu:#a88b8f;--red:#e5222f;--gr:#19c37d;--pu:#a77bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0a0305}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#5a0814 0,var(--bg) 45%) fixed;color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:24px}header small{color:var(--mu)}
.app{display:grid;grid-template-columns:210px 1fr 300px;gap:16px;padding:16px 22px}
nav button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--tx);padding:12px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14px}
nav button small{display:block;color:var(--mu)}nav button.on{background:linear-gradient(90deg,#7a0c1a,#3a0810);border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi small{color:var(--mu)}.kpi b{display:block;font-size:24px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center}
.day.today{border-color:var(--red)}.day small{color:var(--mu)}.day b{display:block;font-size:20px}
.day button{width:30px;height:30px;border-radius:50%;border:1px solid var(--mu);background:none;color:var(--tx);font-size:18px;cursor:pointer;margin-top:6px}
.g{color:var(--gr)}.r{color:#ff5b66}.mu{color:var(--mu)}
.btn{background:var(--red);color:#fff;border:0;border-radius:24px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px}
.btn.s{background:var(--card2);border:1px solid var(--bd)}
.arr{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
.empty{text-align:center;padding:26px;border:1px dashed var(--bd);border-radius:14px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
.tw{overflow-x:auto}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}.sum div:last-child{border:0}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px}
.ring span{background:var(--card);width:84px;height:84px;border-radius:50%;display:grid;place-items:center}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9;padding:16px}.modal.on{display:grid}
.modal form{background:var(--card);border:1px solid var(--red);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--gr)}
.note{background:#3a1a0a;border:1px solid #8a4a1a;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12px}
footer{text-align:center;color:var(--mu);padding:14px;border-top:1px solid var(--bd);margin-top:8px}
.ro .ed{display:none!important}
@media(max-width:1000px){.app{grid-template-columns:1fr}nav{display:flex;gap:6px;overflow-x:auto}nav button{white-space:nowrap;width:auto}.kpis{grid-template-columns:1fr 1fr}.days{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div><h1>🕯️ 600 TRADES JOURNAL</h1><small>EUR/USD • Backtest &amp; Performance</small></div><small>📊 Résultats en lecture seule</small></header>
<div class="app"><nav id="nav"></nav><main id="main"></main><aside id="side"></aside></div>
<footer>Un trade à la fois, vers la liberté.</footer>
<div class="modal" id="md"><form id="f"></form></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mondayOf=d=>{d=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const isoWk=m=>{const t=addD(m,3);return Math.floor((t-new Date(t.getFullYear(),0,1))/864e5/7)+1};
const MON=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],DN=['LUN','MAR','MÈK','JEU','VAN','SAM','DIM'];
const fd=d=>d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
let T=[],S={rr:2.2,risk:100,goal:600},wk=mondayOf(new Date()),view='week',db=null,col=null,sref=null,local=false,ED=true;
const $$=v=>(v<0?'-':'')+'$'+Math.abs(v).toFixed(2);
const stats=l=>{const n=l.length,w=l.filter(t=>t.r>0).length,ls=l.filter(t=>t.r<0).length,gw=l.filter(t=>t.r>0).reduce((a,t)=>a+t.r,0),gl=-l.filter(t=>t.r<0).reduce((a,t)=>a+t.r,0),R=l.reduce((a,t)=>a+t.r,0);
let e=0,pk=0,dd=0;[...l].sort(cmp).forEach(t=>{e+=t.r;pk=Math.max(pk,e);dd=Math.max(dd,pk-e)});
return{n,w,l:ls,R,pnl:R*S.risk,wr:n?w/n*100:0,pf:gl?gw/gl:(gw?99:0),dd,exp:n?R/n:0}};
const firstM=()=>{const n=new Date();return ds(new Date(n.getFullYear(),n.getMonth(),1))},ST=()=>S.start||firstM();
const prevWk=()=>{if(addD(wk,-7)>=mondayOf(new Date(ST()+'T12:00')))wk=addD(wk,-7);render()};
function months(){const m={};T.forEach(t=>{const k=t.date.slice(0,7);(m[k]=m[k]||[]).push(t)});const n=new Date(),cur=n.getFullYear()+'-'+pad(n.getMonth()+1);m[cur]=m[cur]||[];return Object.keys(m).sort().reverse().map(k=>({k,s:stats(m[k])}))}
const cleanShot=v=>{v=(v||'').trim();return !/["'<>\s]/.test(v)&&/^(https?:\/\/|[\w\-\/.]+$)/i.test(v)?v:''};
const cmp=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
function persist(){try{localStorage.setItem('draft',JSON.stringify({trades:T,settings:S}))}catch(e){}}
const EDIT=new URLSearchParams(location.search).has('edit');
async function exp(){const b=new Blob([JSON.stringify({settings:S,trades:T.map(({id,...t})=>t)},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click()}
async function init(){
 ED=EDIT;let bs={};
 try{const r=await fetch('data.json?'+Date.now());if(r.ok){const j=await r.json();T=(j.trades||[]).map((t,i)=>({id:t.id||('b'+i),...t}));bs=j.settings||{}}}catch(e){}
 S={...S,...bs};
 if(EDIT){try{const d=localStorage.getItem('draft');if(d){const j=JSON.parse(d);T=j.trades||T;S={...S,...(j.settings||{})}}}catch(e){}}
 if(!S.start)S.start=firstM();
 local=false;render();}
function render(){document.body.classList.toggle('ro',!ED);
 const nv=[['week','📅','Semaines','Vue par semaine'],['reg','🗂️','Registre '+S.goal+' Trades','Tous les trades'],['ana','📊','Analyses','Stats & Performance'],['set','⚙️','Paramètres','Préférences']].filter(n=>ED||n[0]!='set');
 $('#nav').innerHTML=nv.map(n=>`<button class="${view==n[0]?'on':''}" onclick="view='${n[0]}';render()">${n[1]} ${n[2]}<small>${n[3]}</small></button>`).join('');
 const st=stats(T),pct=Math.min(100,T.length/S.goal*100);
 $('#side').innerHTML=`<div class="card"><h3>📈 Résumé global</h3><div class="sum"><div><span>Total Trades</span><b>${st.n} / ${S.goal}</b></div><div><span>Win Rate</span><b>${st.wr.toFixed(0)}%</b></div><div><span>Profit Factor</span><b>${st.pf.toFixed(2)}</b></div><div><span>Drawdown Max</span><b>${st.dd.toFixed(2)} R</b></div><div><span>P&amp;L Total</span><b class="${st.R>=0?'g':'r'}">${$$(st.pnl)} (${st.R.toFixed(2)} R)</b></div></div></div>
 <div class="card"><h3>🗂️ Registre ${S.goal} Trades</h3><div class="row"><div class="ring" style="background:conic-gradient(var(--red) ${pct}%,var(--bd) 0)"><span>${pct.toFixed(0)}%</span></div><div style="text-align:right"><b style="font-size:22px">${st.n} / ${S.goal}</b><br><span class="mu">trades enregistrés</span></div></div><br><button class="btn" style="width:100%" onclick="view='reg';render()">Voir tous les trades →</button></div><div class="card"><h3>🗓️ Résultats par mois</h3>${months().map(o=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span>${MON[+o.k.slice(5)-1]} ${o.k.slice(0,4)}<br><small class="mu">${o.s.n} trades • ${o.s.wr.toFixed(0)}% WR</small></span><b class="${o.s.R>=0?'g':'r'}" style="text-align:right">${o.s.R.toFixed(2)} R<br><small>${$$(o.s.pnl)}</small></b></div>`).join('')}</div>`;
 $('#main').innerHTML=(EDIT?'<div class="note">✏️ Mode édition : tes changements restent sur cet appareil. Clique <button class="btn s" onclick="exp()">Exporter data.json</button> puis remplace data.json sur GitHub pour publier.</div>':'')+(!ED?'<div class="note">👁️ Lecture seule : tu peux consulter les résultats, pas les modifier.</div>':'')+(local?'<div class="note">Mode local : les données restent dans ce navigateur seulement.</div>':'')+({week:vWeek,reg:vReg,ana:vAna,set:vSet}[view])();}
function vWeek(){const e=addD(wk,6),days=[...Array(7)].map((_,i)=>addD(wk,i)),wl=T.filter(t=>t.date>=ds(wk)&&t.date<=ds(e)),s=stats(wl),td=ds(new Date());
 return `<div class="card"><div class="row"><div><h2 style="margin:0">Semaine ${isoWk(wk)}</h2><span class="mu">Lundi ${fd(wk)} → Dimanche ${fd(e)}</span></div><div><button class="arr" onclick="prevWk()">‹</button> <button class="arr" onclick="wk=mondayOf(new Date());render()">Auj.</button> <button class="arr" onclick="wk=addD(wk,7);render()">›</button></div></div>
 <div class="kpis"><div class="kpi"><small>Trades</small><b>${s.n}</b><small>/ 7 jours</small></div><div class="kpi"><small>P&amp;L</small><b class="${s.R>=0?'g':'r'}">${$$(s.pnl)}</b><small>(${s.R.toFixed(2)} R)</small></div><div class="kpi"><small>Win Rate</small><b>${s.wr.toFixed(0)}%</b><small>${s.w}W / ${s.l}L</small></div><div class="kpi"><small>Profit Factor</small><b>${s.pf.toFixed(2)}</b></div></div>
 <div class="days">${days.map((d,i)=>{const l=T.filter(t=>t.date==ds(d)),x=stats(l);return `<div class="day ${ds(d)==td?'today':''}"><small>${DN[i]}</small><b>${d.getDate()}</b><small>${l.length} trades</small><div><b style="font-size:14px" class="${x.R>=0?'g':'r'}">${$$(x.pnl)}</b><small>(${x.R.toFixed(2)} R)</small></div>${ds(d)<ST()?'':`<button class="ed" onclick="openF('${ds(d)}')">+</button>`}</div>`}).join('')}</div>
 <br>${wl.length?tbl(wl.sort(cmp)):`<div class="empty"><div style="font-size:30px">📅</div><b>Aucun trade cette semaine</b><p class="mu">Ajoute tes trades pour voir les résultats de la semaine.</p><button class="btn ed" onclick="openF()">＋ Ajouter un trade</button></div>`}</div>`}
function tbl(l){return `<div class="tw"><table><tr><th>Date</th><th>Sens</th><th>Entrée</th><th>SL</th><th>TP</th><th>Résultat</th><th>R</th><th>P&amp;L</th><th>📷</th><th class="ed"></th></tr>${l.map(t=>`<tr><td>${t.date.slice(5)} ${t.time||''}</td><td>${t.dir}</td><td>${t.entry||'–'}</td><td>${t.sl||'–'}</td><td>${t.tp||'–'}</td><td class="${t.r>0?'g':t.r<0?'r':''}">${t.res}</td><td>${t.r>0?'+':''}${t.r}</td><td>${$$(t.r*S.risk)}</td><td>${t.shot?`<a href="${t.shot}" target="_blank" rel="noopener" style="color:var(--pu);text-decoration:none">📷 Voir</a>`:'–'}</td><td class="ed"><button class="arr" onclick="del('${t.id}')">🗑</button></td></tr>`).join('')}</table></div>`}
function vReg(){return `<div class="card"><div class="row"><h2 style="margin:0">Registre ${S.goal} Trades</h2><button class="btn ed" onclick="openF()">＋ Ajouter</button></div><br>${T.length?tbl([...T].sort(cmp).reverse()):'<div class="empty mu">Aucun trade enregistré.</div>'}</div>`}
function vAna(){const s=stats(T),l=[...T].sort(cmp);let e=0;const pts=l.map(t=>e+=t.r);
 let svg='<p class="mu">Pas encore de données.</p>';
 if(pts.length>1){const mx=Math.max(...pts,0),mn=Math.min(...pts,0),sp=(mx-mn)||1,P=pts.map((v,i)=>(i/(pts.length-1)*580+10).toFixed(1)+','+(170-(v-mn)/sp*150).toFixed(1));
  svg=`<svg viewBox="0 0 600 180" style="width:100%"><line x1="10" x2="590" y1="${170-(0-mn)/sp*150}" y2="${170-(0-mn)/sp*150}" stroke="#4a1319"/><polyline fill="none" stroke="#19c37d" stroke-width="2.5" points="${P.join(' ')}"/></svg>`}
 const wd=DN.map((n,i)=>{const x=stats(l.filter(t=>(new Date(t.date+'T12:00').getDay()+6)%7==i));return `<div class="row" style="margin:6px 0"><span style="width:40px">${n}</span><div class="bar"><i style="width:${x.wr}%"></i></div><span style="width:110px;text-align:right">${x.wr.toFixed(0)}% (${x.n})</span></div>`}).join('');
 return `<div class="card"><h2 style="margin-top:0">Analyses</h2><div class="kpis"><div class="kpi"><small>Espérance</small><b>${s.exp.toFixed(2)} R</b><small>par trade</small></div><div class="kpi"><small>Profit Factor</small><b>${s.pf.toFixed(2)}</b></div><div class="kpi"><small>Drawdown max</small><b>${s.dd.toFixed(2)} R</b></div><div class="kpi"><small>Total</small><b class="${s.R>=0?'g':'r'}">${s.R.toFixed(2)} R</b></div></div><h3>Courbe d’équité (R)</h3>${svg}<h3>Win rate par jour</h3>${wd}<p class="mu">Fiable à partir de 100 trades ou plus.</p></div>`}
function vSet(){return `<div class="card"><h2 style="margin-top:0">Paramètres</h2><div class="two"><div><label>R:R du TP (multiple du SL)</label><input id="s1" type="number" step="0.1" value="${S.rr}"></div><div><label>Valeur de 1R ($)</label><input id="s2" type="number" value="${S.risk}"></div></div><label>Objectif de trades</label><input id="s3" type="number" value="${S.goal}"><label>Début du journal</label><input id="s4" type="date" value="${ST()}"><br><br><button class="btn" onclick="saveS()">Enregistrer</button></div>`}
async function saveS(){if(!ED)return;S={rr:+$('#s1').value||2.2,risk:+$('#s2').value||100,goal:+$('#s3').value||600,start:$('#s4').value||ST()};persist();render()}
function openF(d){$('#f').innerHTML=`<h3 style="margin-top:0">Ajouter un trade</h3><div class="two"><div><label>Date</label><input id="d" type="date" required min="${ST()}" value="${d||ds(new Date())}"></div><div><label>Heure</label><input id="h" type="time"></div></div>
<div class="two"><div><label>Sens</label><select id="di"><option>BUY</option><option>SELL</option></select></div><div><label>Résultat</label><select id="re" onchange="$('#r').value={TP:S.rr,SL:-1,BE:0}[this.value]??''"><option>TP</option><option>SL</option><option>BE</option><option>Autre</option></select></div></div>
<label>R obtenu</label><input id="r" type="number" step="0.01" value="${S.rr}" required>
<div class="two"><div><label>Entrée</label><input id="en" type="number" step="0.00001"></div><div><label>SL</label><input id="sl" type="number" step="0.00001"></div></div><label>TP</label><input id="tp" type="number" step="0.00001"><label>Screenshot (lien ou chemin, ex. shots/13-oct-1.png)</label><input id="sh" placeholder="https://www.tradingview.com/x/...">
<div class="row" style="margin-top:16px"><button type="button" class="btn s" onclick="$('#md').classList.remove('on')">Annuler</button><button class="btn">Enregistrer</button></div>`;$('#md').classList.add('on')}
$('#f').onsubmit=async e=>{e.preventDefault();const t={date:$('#d').value,time:$('#h').value,dir:$('#di').value,res:$('#re').value,r:+$('#r').value,entry:$('#en').value,sl:$('#sl').value,tp:$('#tp').value,shot:cleanShot($('#sh').value)};
 $('#md').classList.remove('on');
 T.push({id:Date.now()+'',...t});persist();render()};
async function del(id){if(!ED||!confirm('Supprimer ce trade ?'))return;T=T.filter(t=>t.id!=id);persist();render()}
init();
</script></body></html>
